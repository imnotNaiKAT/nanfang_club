<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楠芳·俱乐部 - 用户主页</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <style>
        .user-page { max-width: 900px; margin: 0 auto; padding: 20px; }
        .user-profile { background-color: var(--bg-primary); border-radius: var(--border-radius-lg); overflow: hidden; }
        .user-header { display: flex; align-items: center; gap: 24px; padding: 32px 24px; border-bottom: 1px solid var(--border-color); }
        .user-profile-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); }
        .user-details { flex: 1; }
        .user-details h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
        .user-grade { color: var(--text-tertiary); font-size: 0.9rem; margin-bottom: 8px; }
        .user-bio { color: var(--text-secondary); line-height: 1.6; }
        .user-posts-section { padding: 24px; }
        .user-posts-section h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .user-posts-list { display: flex; flex-direction: column; gap: 12px; }
        .user-post-item { padding: 16px; background-color: var(--bg-tertiary); border-radius: var(--border-radius-md); cursor: pointer; transition: background-color 0.2s; }
        .user-post-item:hover { background-color: var(--banner-hover-bg); }
        .user-post-item h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .user-post-item p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 4px; }
        .post-date { font-size: 0.8rem; color: var(--text-tertiary); }
        .no-posts { text-align: center; padding: 40px; color: var(--text-tertiary); }
        @media (max-width: 600px) {
            .user-header { flex-direction: column; text-align: center; padding: 24px 16px; }
            .user-profile-avatar { width: 72px; height: 72px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-area">
                    <img src="assets/images/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                    <span class="site-name">楠芳·俱乐部</span>
                </div>
            </div>
            <div class="nav-center">
                <a href="index.html" class="nav-link">主页</a>
                <a href="posts.html" class="nav-link">帖子</a>
                <div class="search-box">
                    <input type="text" id="quick-search" placeholder="键入以搜索......">
                    <button onclick="quickSearch()">&#128269;</button>
                </div>
                <a href="settings-new.html" class="nav-link">设置</a>
                <a href="about.html" class="nav-link">关于</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()">&#9790;</button>
                <div class="user-info" id="user-info" style="display:none;">
                    <img src="" alt="头像" class="user-avatar" id="nav-avatar">
                    <span id="nav-username"></span>
                </div>
                <a href="settings-new.html" class="nav-link" id="login-btn">登录/注册</a>
            </div>
        </div>
    </nav>

    <main class="main-content user-page">
        <div class="user-profile">
            <div class="user-header">
                <img src="" alt="头像" class="user-profile-avatar" id="user-profile-avatar">
                <div class="user-details">
                    <h1 id="user-profile-name"></h1>
                    <p class="user-grade" id="user-profile-grade"></p>
                    <p class="user-bio" id="user-profile-bio"></p>
                </div>
            </div>
            <div class="user-posts-section">
                <h2>发布的帖子</h2>
                <div class="user-posts-list" id="user-posts-list"></div>
                <div class="no-posts" id="no-posts" style="display:none;">该用户还没有发布帖子</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 楠芳·俱乐部 - 株洲市南方中学</p>
        <p class="disclaimer">本网站为非官方个人网站，仅供校内学生使用</p>
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/mobile.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const userId = new URLSearchParams(window.location.search).get('id');
            if (userId) {
                await loadUserProfile(userId);
            }
        });

        async function loadUserProfile(userId) {
            try {
                const userData = await API.user.getById(userId);
                if (!userData.success) {
                    alert(userData.error || userData.message || '用户不存在');
                    history.back();
                    return;
                }
                const user = userData.user;
                document.getElementById('user-profile-avatar').src = user.avatar || 'assets/images/default_avatar.png';
                document.getElementById('user-profile-avatar').onerror = function() { this.src = 'assets/images/default_avatar.png'; };
                document.getElementById('user-profile-name').textContent = user.nickname || '未知用户';
                document.getElementById('user-profile-grade').textContent = (user.grade || '') + '届';
                document.getElementById('user-profile-bio').textContent = user.bio || '暂无简介';

                const postsRes = await API.posts.byAuthor(userId);
                const posts = postsRes.success ? (postsRes.posts || []) : [];
                const listEl = document.getElementById('user-posts-list');
                const noPostsEl = document.getElementById('no-posts');

                if (posts.length === 0) {
                    listEl.innerHTML = '';
                    noPostsEl.style.display = 'block';
                    return;
                }

                noPostsEl.style.display = 'none';
                listEl.innerHTML = posts.map(post => `
                    <div class="user-post-item" onclick="window.location.href='post-detail.html?id=${post.id}'">
                        <h3>${escapeHtml(post.title)}</h3>
                        <p>${escapeHtml((post.content || '').substring(0, 100))}...</p>
                        <span class="post-date">${formatDate(new Date(post.createdAt))}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load user:', e);
                alert('加载用户信息失败');
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function formatDate(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + '天前';
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
