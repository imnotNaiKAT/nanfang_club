<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楠芳·俱乐部 - 帖子</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-area">
                    <img src="assets/images/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                    <span class="site-name">楠芳·俱乐部</span>
                </div>
            </div>
            <div class="nav-center">
                <a href="index.html" class="nav-link">主页</a>
                <a href="posts.html" class="nav-link active">帖子</a>
                <div class="search-box">
                    <input type="text" id="quick-search" placeholder="键入以搜索......">
                    <button onclick="quickSearch()">&#128269;</button>
                </div>
                <a href="settings.html" class="nav-link">设置</a>
                <a href="about.html" class="nav-link">关于</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()">&#9790;</button>
                <div class="user-info" id="user-info" style="display:none;">
                    <img src="" alt="头像" class="user-avatar" id="nav-avatar">
                    <span id="nav-username"></span>
                </div>
                <a href="settings.html" class="nav-link" id="login-btn">登录/注册</a>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content posts-page">
        <!-- 发帖按钮 -->
        <div class="create-post-bar">
            <button class="create-post-btn" onclick="showCreatePostModal()">+ 发布新帖子</button>
        </div>

        <!-- 帖子列表 -->
        <div class="posts-grid" id="posts-grid">
            <!-- 帖子卡片将通过JS动态加载 -->
        </div>
    </main>

    <!-- 发帖模态框 -->
    <div class="modal" id="create-post-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>发布新帖子</h2>
                <button class="close-btn" onclick="closeCreatePostModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="post-title">标题</label>
                    <input type="text" id="post-title" placeholder="请输入帖子标题">
                </div>
                <div class="form-group">
                    <label for="post-content">内容（支持Markdown）</label>
                    <textarea id="post-content" rows="10" placeholder="请输入帖子内容，支持Markdown格式..."></textarea>
                </div>
                <div class="form-group">
                    <label for="post-images">图片</label>
                    <input type="file" id="post-images" multiple accept="image/*">
                    <div class="preview-area" id="image-preview"></div>
                </div>
                <div class="form-group">
                    <label for="post-files">文件</label>
                    <input type="file" id="post-files" multiple>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCreatePostModal()">取消</button>
                <button class="btn btn-primary" onclick="submitPost()">发布</button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2024 楠芳·俱乐部 - 株洲市南方中学</p>
    </footer>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/posts.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
