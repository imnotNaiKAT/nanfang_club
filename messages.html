<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楠芳·俱乐部 - 消息</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/mobile.css">
    <style>
        .messages-page { max-width: 900px; margin: 0 auto; }
        .messages-tabs { display: flex; background-color: var(--section-bg); border-radius: var(--border-radius-lg); margin-bottom: var(--spacing-lg); overflow: hidden; }
        .messages-tab { flex: 1; padding: var(--spacing-md); text-align: center; cursor: pointer; transition: all var(--transition-fast); border-bottom: 2px solid transparent; }
        .messages-tab:hover { background-color: var(--navbar-hover); }
        .messages-tab.active { background-color: var(--primary-color); color: white; border-bottom-color: var(--primary-color); }
        .messages-tab .badge { display: inline-block; background-color: var(--danger-color); color: white; font-size: 0.75rem; padding: 2px 6px; border-radius: 10px; margin-left: var(--spacing-xs); }
        .message-list { display: flex; flex-direction: column; gap: var(--spacing-sm); }
        .message-item { display: flex; align-items: flex-start; gap: var(--spacing-md); padding: var(--spacing-md); background-color: var(--section-bg); border-radius: var(--border-radius-md); cursor: pointer; transition: background-color var(--transition-fast); }
        .message-item:hover { background-color: var(--banner-hover-bg); }
        .message-item.unread { border-left: 3px solid var(--primary-color); }
        .message-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .message-content { flex: 1; min-width: 0; }
        .message-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xs); }
        .message-sender { font-weight: 600; color: var(--text-primary); }
        .message-time { font-size: 0.85rem; color: var(--text-tertiary); }
        .message-preview { color: var(--text-secondary); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .message-type { font-size: 0.75rem; padding: 2px 8px; border-radius: var(--border-radius-sm); background-color: var(--bg-tertiary); color: var(--text-secondary); }
        .message-type.like { background-color: #fee2e2; color: #ef4444; }
        .message-type.comment { background-color: #dbeafe; color: #2563eb; }
        .message-type.follow { background-color: #dcfce7; color: #22c55e; }
        .message-type.system { background-color: #fef3c7; color: #f59e0b; }
        .empty-messages { text-align: center; padding: var(--spacing-xl) * 2; color: var(--text-tertiary); }
        .empty-messages-icon { font-size: 4rem; margin-bottom: var(--spacing-md); }
        @media (max-width: 768px) {
            .messages-tabs { flex-wrap: nowrap; overflow-x: auto; }
            .message-item { padding: var(--spacing-sm); }
            .message-avatar { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <div class="logo-area">
                    <img src="assets/images/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                    <span class="site-name">楠芳·俱乐部</span>
                </div>
            </div>
            <div class="nav-center">
                <a href="index.html" class="nav-link">主页</a>
                <a href="posts.html" class="nav-link">帖子</a>
                <div class="search-box">
                    <input type="text" id="quick-search" placeholder="键入以搜索......">
                    <button onclick="quickSearch()">&#128269;</button>
                </div>
                <a href="messages.html" class="nav-link active">消息</a>
                <a href="settings-new.html" class="nav-link">设置</a>
                <a href="about.html" class="nav-link">关于</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()">&#9790;</button>
                <div class="user-info" id="user-info" style="display:none;">
                    <img src="" alt="头像" class="user-avatar" id="nav-avatar">
                    <span id="nav-username"></span>
                </div>
                <a href="settings-new.html" class="nav-link" id="login-btn">登录/注册</a>
            </div>
        </div>
    </nav>

    <main class="main-content messages-page">
        <div class="messages-tabs">
            <div class="messages-tab active" data-tab="all" onclick="switchMessageTab('all')">全部<span class="badge" id="badge-all" style="display:none;">0</span></div>
            <div class="messages-tab" data-tab="likes" onclick="switchMessageTab('likes')">点赞<span class="badge" id="badge-likes" style="display:none;">0</span></div>
            <div class="messages-tab" data-tab="comments" onclick="switchMessageTab('comments')">评论<span class="badge" id="badge-comments" style="display:none;">0</span></div>
            <div class="messages-tab" data-tab="follows" onclick="switchMessageTab('follows')">关注<span class="badge" id="badge-follows" style="display:none;">0</span></div>
            <div class="messages-tab" data-tab="system" onclick="switchMessageTab('system')">系统<span class="badge" id="badge-system" style="display:none;">0</span></div>
        </div>

        <div class="message-list" id="message-list"></div>

        <div class="empty-messages" id="empty-messages" style="display:none;">
            <div class="empty-messages-icon">📭</div>
            <p>暂无消息</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 楠芳·俱乐部 - 株洲市南方中学</p>
        <p class="disclaimer">本网站为非官方个人网站，仅供校内学生使用</p>
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/mobile.js"></script>
    <script>
        let currentTab = 'all';

        document.addEventListener('DOMContentLoaded', function() {
            if (!Auth.currentUser) {
                document.getElementById('empty-messages').style.display = 'block';
                document.getElementById('message-list').innerHTML = '';
                return;
            }
            loadMessages();
        });

        async function loadMessages() {
            const currentUser = Auth.currentUser;
            if (!currentUser) {
                document.getElementById('empty-messages').style.display = 'block';
                document.getElementById('message-list').innerHTML = '';
                return;
            }

            try {
                const res = await API.messages.getAll();
                if (!res.success) {
                    document.getElementById('empty-messages').style.display = 'block';
                    return;
                }

                let messages = res.messages || [];

                if (currentTab !== 'all') {
                    messages = messages.filter(m => m.type === currentTab);
                }

                messages.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                const listEl = document.getElementById('message-list');
                const emptyEl = document.getElementById('empty-messages');

                if (messages.length === 0) {
                    listEl.innerHTML = '';
                    emptyEl.style.display = 'block';
                    updateBadges([]);
                    return;
                }

                emptyEl.style.display = 'none';
                listEl.innerHTML = messages.map(msg => renderMessage(msg)).join('');
                updateBadges(messages);
            } catch (e) {
                console.error('Failed to load messages:', e);
                document.getElementById('empty-messages').style.display = 'block';
            }
        }

        function renderMessage(msg) {
            const sender = msg.fromUser || {};
            const senderName = sender.nickname || '系统';
            const senderAvatar = sender.avatar || 'assets/images/default_avatar.png';

            const typeLabels = { 'like': '点赞', 'comment': '评论', 'follow': '关注', 'system': '系统' };
            const timeAgo = formatTimeAgo(new Date(msg.createdAt));

            return `
                <div class="message-item ${msg.read ? '' : 'unread'}" onclick="openMessage('${msg.id}')">
                    <img src="${senderAvatar}" alt="头像" class="message-avatar" onerror="this.src='assets/images/default_avatar.png'">
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-sender">${escapeHtml(senderName)}</span>
                            <span class="message-time">${timeAgo}</span>
                        </div>
                        <div class="message-preview">
                            <span class="message-type ${msg.type}">${typeLabels[msg.type] || '通知'}</span>
                            ${escapeHtml(msg.content)}
                        </div>
                    </div>
                </div>
            `;
        }

        function formatTimeAgo(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + '天前';
            return date.toLocaleDateString();
        }

        function updateBadges(messages) {
            const counts = { all: 0, likes: 0, comments: 0, follows: 0, system: 0 };
            messages.forEach(m => {
                if (!m.read) {
                    counts.all++;
                    if (counts[m.type] !== undefined) counts[m.type]++;
                }
            });

            Object.keys(counts).forEach(key => {
                const badge = document.getElementById('badge-' + key);
                if (badge) {
                    if (counts[key] > 0) {
                        badge.textContent = counts[key] > 99 ? '99+' : counts[key];
                        badge.style.display = 'inline-block';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            });
        }

        async function openMessage(msgId) {
            try {
                await API.messages.markRead(msgId);
            } catch (e) { console.error(e); }

            const typeLabels = { 'like': '点赞', 'comment': '评论', 'follow': '关注', 'system': '系统' };
            const urlParams = new URLSearchParams(window.location.search);

            if (urlParams.get('id')) {
                const msgType = urlParams.get('type');
                const postId = urlParams.get('postId');
                const fromUserId = urlParams.get('fromUserId');

                if (msgType === 'like' || msgType === 'comment') {
                    if (postId) window.location.href = 'post-detail.html?id=' + postId;
                } else if (msgType === 'follow') {
                    if (fromUserId) window.location.href = 'user.html?id=' + fromUserId;
                } else if (msgType === 'system') {
                    window.location.reload();
                }
            }

            loadMessages();
        }

        function switchMessageTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.messages-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`.messages-tab[data-tab="${tab}"]`).classList.add('active');
            loadMessages();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
