<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楠芳·俱乐部 - 主页</title>
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg: #f5f7fa;
            --card-bg: white;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 16px 24px;
            color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .nav-link:hover {
            opacity: 1;
        }

        /* 主内容 */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 欢迎区域 */
        .welcome-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .welcome-title {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            color: var(--text-light);
            font-size: 16px;
        }

        /* 轮播图 */
        .carousel-section {
            margin-bottom: 32px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 400px;
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s;
            background-size: cover;
            background-position: center;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s;
        }

        .carousel-dot.active {
            background: white;
        }

        /* 板块 */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .section-card:hover {
            transform: translateY(-4px);
        }

        .section-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .section-content {
            padding: 20px;
        }

        .banner-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--bg);
            cursor: pointer;
            transition: background 0.3s;
        }

        .banner-item:hover {
            background: #edf2f7;
        }

        .banner-item:last-child {
            margin-bottom: 0;
        }

        /* 帖子瀑布流 */
        .posts-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .posts-waterfall {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width: 1200px) {
            .posts-waterfall {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .posts-waterfall {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .posts-waterfall {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.3s;
            break-inside: avoid;
        }

        .post-card:hover {
            transform: translateY(-4px);
        }

        .post-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .post-info {
            padding: 12px;
        }

        .post-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .post-stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-light);
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .post-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
        }

        .post-username {
            font-size: 12px;
            color: var(--text-light);
        }

        /* 添加按钮 */
        .add-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .navbar {
                padding: 12px 16px;
            }

            .nav-links {
                gap: 12px;
                font-size: 14px;
            }

            .site-name {
                font-size: 18px;
            }

            .main-content {
                padding: 16px;
            }

            .welcome-title {
                font-size: 24px;
            }

            .carousel-container {
                height: 250px;
            }

            .section-title {
                font-size: 20px;
            }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="site-name">楠芳·俱乐部</div>
            <div class="nav-links">
                <a href="index-simple.html" class="nav-link">主页</a>
                <a href="posts-simple.html" class="nav-link">帖子</a>
                <a href="messages-simple.html" class="nav-link">消息</a>
                <a href="settings-new.html" class="nav-link">设置</a>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- 欢迎区域 -->
        <section class="welcome-section">
            <h1 class="welcome-title">欢迎来到楠芳·俱乐部</h1>
            <p class="welcome-subtitle">株洲市南方中学的社区平台</p>
        </section>

        <!-- 轮播图 -->
        <section class="carousel-section">
            <div class="carousel-container" id="carousel-container">
                <!-- 轮播图将通过JS动态加载 -->
            </div>
            <div class="carousel-dots" id="carousel-dots"></div>
        </section>

        <!-- 板块区域 -->
        <section class="sections-grid" id="sections-grid">
            <!-- 公告板块 -->
            <div class="section-card">
                <div class="section-header">📢 公告</div>
                <div class="section-content" id="announcements-list">
                    <div class="banner-item">暂无公告</div>
                </div>
            </div>

            <!-- 活动板块 -->
            <div class="section-card">
                <div class="section-header">🎉 活动</div>
                <div class="section-content" id="activities-list">
                    <div class="banner-item">暂无活动</div>
                </div>
            </div>

            <!-- 更多板块将通过JS动态加载 -->
        </section>

        <!-- 帖子区域 -->
        <section class="posts-section">
            <div class="section-title">
                <span>最新帖子</span>
                <a href="create-post-simple.html" class="add-btn">+ 发布帖子</a>
            </div>

            <div class="posts-waterfall" id="posts-container">
                <!-- 帖子将通过JS动态加载 -->
            </div>
        </section>
    </main>

    <script>
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadCarousel();
            loadSections();
            loadPosts();
        });

        // 加载轮播图
        function loadCarousel() {
            const container = document.getElementById('carousel-container');
            const dotsContainer = document.getElementById('carousel-dots');

            const images = JSON.parse(localStorage.getItem('carouselImages') || '[]');

            if (images.length === 0) {
                // 默认轮播图
                const defaultSlides = [
                    { url: '', title: '欢迎使用楠芳·俱乐部' },
                    { url: '', title: '株洲市南方中学社区平台' },
                    { url: '', title: '分享生活，记录美好' }
                ];

                container.innerHTML = defaultSlides.map((slide, index) => `
                    <div class="carousel-slide ${index === 0 ? 'active' : ''}">
                        ${slide.title}
                    </div>
                `).join('');

                dotsContainer.innerHTML = defaultSlides.map((_, index) => `
                    <div class="carousel-dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>
                `).join('');
            } else {
                container.innerHTML = images.map((img, index) => `
                    <div class="carousel-slide ${index === 0 ? 'active' : ''}"
                         style="background-image: url('${img.url}'); ${img.url ? '' : 'background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);'}">
                        ${img.title}
                    </div>
                `).join('');

                dotsContainer.innerHTML = images.map((_, index) => `
                    <div class="carousel-dot ${index === 0 ? 'active' : ''}" onclick="goToSlide(${index})"></div>
                `).join('');
            }

            // 自动播放
            startCarousel();
        }

        let currentSlide = 0;
        let carouselInterval;

        function startCarousel() {
            carouselInterval = setInterval(() => {
                const slides = document.querySelectorAll('.carousel-slide');
                const dots = document.querySelectorAll('.carousel-dot');

                if (slides.length === 0) return;

                currentSlide = (currentSlide + 1) % slides.length;

                slides.forEach((slide, index) => {
                    slide.classList.toggle('active', index === currentSlide);
                });

                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentSlide);
                });
            }, 5000);
        }

        function goToSlide(index) {
            currentSlide = index;

            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.carousel-dot');

            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        // 加载板块
        function loadSections() {
            const sections = JSON.parse(localStorage.getItem('sections') || '["announcements", "activities"]');
            const sectionNames = JSON.parse(localStorage.getItem('sectionNames') || '{}');

            // 默认名称
            const defaultNames = {
                'announcements': '公告',
                'activities': '活动'
            };

            const sectionsGrid = document.getElementById('sections-grid');

            // 保留默认的两个板块
            sectionsGrid.innerHTML = `
                <div class="section-card">
                    <div class="section-header">📢 公告</div>
                    <div class="section-content" id="announcements-list">
                        <div class="banner-item">暂无公告</div>
                    </div>
                </div>
                <div class="section-card">
                    <div class="section-header">🎉 活动</div>
                    <div class="section-content" id="activities-list">
                        <div class="banner-item">暂无活动</div>
                    </div>
                </div>
            `;

            // 添加自定义板块
            sections.slice(2).forEach(sectionId => {
                const name = sectionNames[sectionId] || sectionId;
                const card = document.createElement('div');
                card.className = 'section-card';
                card.innerHTML = `
                    <div class="section-header">${name}</div>
                    <div class="section-content">
                        <div class="banner-item">暂无内容</div>
                    </div>
                `;
                sectionsGrid.appendChild(card);
            });
        }

        // 加载帖子
        function loadPosts() {
            const container = document.getElementById('posts-container');
            const posts = JSON.parse(localStorage.getItem('posts') || '[]');
            const users = JSON.parse(localStorage.getItem('users') || '[]');

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div>暂无帖子，快来发布第一篇吧！</div>
                    </div>
                `;
                return;
            }

            // 按时间倒序
            const sortedPosts = posts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            // 只显示前20条
            const displayPosts = sortedPosts.slice(0, 20);

            container.innerHTML = displayPosts.map(post => {
                const author = users.find(u => u.id === post.authorId);
                const authorName = author ? author.nickname : '匿名用户';
                const avatar = author && author.avatar ? author.avatar : '';

                const imageUrl = post.images && post.images.length > 0
                    ? post.images[0]
                    : '';

                return `
                    <div class="post-card" onclick="viewPost('${post.id}')">
                        ${imageUrl
                            ? `<img src="${imageUrl}" alt="${post.title}" class="post-image" onerror="this.style.background='linear-gradient(135deg, #667eea 0%, #764ba2 100%)'">`
                            : `<div class="post-image" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white;">📝</div>`
                        }
                        <div class="post-info">
                            <div class="post-title">${post.title}</div>
                            <div class="post-stats">
                                <span>❤️ ${post.likes ? post.likes.length : 0}</span>
                                <span>💬 ${post.comments ? post.comments.length : 0}</span>
                            </div>
                            <div class="post-author">
                                ${avatar
                                    ? `<img src="${avatar}" alt="${authorName}" class="post-avatar">`
                                    : `<div class="post-avatar"></div>`
                                }
                                <span class="post-username">${authorName}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 查看帖子
        function viewPost(postId) {
            localStorage.setItem('viewingPostId', postId);
            window.location.href = 'post-detail-simple.html';
        }
    </script>
</body>
</html>
