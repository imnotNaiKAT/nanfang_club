<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布帖子 - 楠芳·俱乐部</title>
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg: #f5f7fa;
            --card-bg: white;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* 导航栏 */
        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 16px 24px;
            color: white;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-name {
            font-size: 24px;
            font-weight: 700;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            opacity: 0.9;
        }

        .nav-link:hover {
            opacity: 1;
        }

        /* 主内容 */
        .main-content {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 32px;
            margin-bottom: 32px;
            text-align: center;
        }

        /* 表单 */
        .post-form {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }

        /* 图片上传 */
        .image-upload-section {
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(102, 126, 234, 0.05);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            color: var(--text-light);
        }

        .image-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .image-preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 24px;
        }

        /* 按钮 */
        .btn {
            padding: 12px 32px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text);
            margin-top: 12px;
            width: 100%;
        }

        /* 提示 */
        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-content {
                margin: 20px auto;
                padding: 0 16px;
            }

            .page-title {
                font-size: 24px;
            }

            .post-form {
                padding: 20px;
            }

            .image-preview-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="site-name">楠芳·俱乐部</div>
            <a href="index-simple.html" class="nav-link">返回主页</a>
        </div>
    </nav>

    <!-- 加载状态 -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
        <h1 class="page-title">发布帖子</h1>

        <div class="post-form">
            <div class="alert alert-warning" id="login-warning" style="display: none;">
                ⚠️ 您还未登录，请先<a href="settings-new.html" style="color: #667eea; font-weight: 600;">登录</a>后再发布帖子。
            </div>

            <form id="post-form" onsubmit="publishPost(event)">
                <div class="form-group">
                    <label for="post-title">标题 *</label>
                    <input type="text" id="post-title" placeholder="请输入帖子标题（最多50字）" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="post-content">内容 *</label>
                    <textarea id="post-content" placeholder="分享你的想法..." required></textarea>
                </div>

                <div class="image-upload-section">
                    <label>图片（可选，最多9张）</label>
                    <div class="upload-area" onclick="document.getElementById('image-input').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击上传图片</div>
                        <input type="file" id="image-input" accept="image/*" multiple style="display: none;" onchange="handleImageUpload(this)">
                    </div>
                    <div class="image-preview-grid" id="image-preview"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="publish-btn">发布帖子</button>
                <button type="button" class="btn btn-secondary" onclick="saveDraft()">保存草稿</button>
            </form>
        </div>
    </main>

    <script>
        let uploadedImages = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            loadDraft();
        });

        // 检查登录状态
        function checkLoginStatus() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                document.getElementById('login-warning').style.display = 'block';
                document.getElementById('publish-btn').disabled = true;
            }
        }

        // 处理图片上传
        function handleImageUpload(input) {
            const files = Array.from(input.files);
            const maxImages = 9;

            if (uploadedImages.length + files.length > maxImages) {
                alert(`最多只能上传${maxImages}张图片`);
                return;
            }

            files.forEach(file => {
                if (!file.type.startsWith('image/')) {
                    alert('请上传图片文件');
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert('图片大小不能超过5MB');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push({
                        data: e.target.result,
                        name: file.name
                    });
                    renderImagePreviews();
                };
                reader.readAsDataURL(file);
            });

            // 清空input
            input.value = '';
        }

        // 渲染图片预览
        function renderImagePreviews() {
            const container = document.getElementById('image-preview');
            container.innerHTML = uploadedImages.map((img, index) => `
                <div class="image-preview-item">
                    <img src="${img.data}" alt="预览${index + 1}">
                    <button type="button" class="image-remove-btn" onclick="removeImage(${index})">×</button>
                </div>
            `).join('');
        }

        // 移除图片
        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderImagePreviews();
        }

        // 发布帖子
        function publishPost(event) {
            event.preventDefault();

            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('请先登录');
                window.location.href = 'settings-new.html';
                return;
            }

            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }

            if (title.length > 50) {
                alert('标题不能超过50字');
                return;
            }

            // 显示加载状态
            document.getElementById('loading-overlay').classList.add('show');
            document.getElementById('publish-btn').disabled = true;

            // 创建帖子对象
            const newPost = {
                id: 'post_' + Date.now(),
                title: title,
                content: content,
                authorId: currentUser.id,
                images: uploadedImages.map(img => img.data),
                likes: [],
                comments: [],
                views: 0,
                createdAt: new Date().toISOString()
            };

            // 保存到localStorage
            setTimeout(() => {
                try {
                    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
                    posts.unshift(newPost);
                    localStorage.setItem('posts', JSON.stringify(posts));

                    alert('发布成功！');
                    window.location.href = 'index-simple.html';
                } catch (error) {
                    console.error('发布错误:', error);
                    alert('发布失败，请稍后重试');
                    document.getElementById('loading-overlay').classList.remove('show');
                    document.getElementById('publish-btn').disabled = false;
                }
            }, 500);
        }

        // 保存草稿
        function saveDraft() {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!title && !content) {
                alert('请先填写内容');
                return;
            }

            const draft = {
                title: title,
                content: content,
                images: uploadedImages,
                savedAt: new Date().toISOString()
            };

            localStorage.setItem('postDraft', JSON.stringify(draft));
            alert('草稿已保存');
        }

        // 加载草稿
        function loadDraft() {
            const draft = JSON.parse(localStorage.getItem('postDraft'));
            if (draft) {
                if (confirm('检测到未完成的草稿，是否恢复？')) {
                    document.getElementById('post-title').value = draft.title || '';
                    document.getElementById('post-content').value = draft.content || '';
                    uploadedImages = draft.images || [];
                    renderImagePreviews();
                }
            }
        }
    </script>
</body>
</html>
